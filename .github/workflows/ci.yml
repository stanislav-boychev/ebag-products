name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ebag
          POSTGRES_PASSWORD: ebag
          POSTGRES_DB: products
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ebag -d products"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://ebag:ebag@localhost:5433/products
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -v
